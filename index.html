<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1014" />
    <title>Programa 5S + SOL · Mondial</title>
    <meta name="description" content="Programa 5S + SOL — auditorias de organização, disciplina e segurança. O sol vai nascer na Mondial." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1014'/%3E%3Ccircle cx='32' cy='34' r='13' fill='%23F59E0B'/%3E%3Cpath d='M32 8v6M32 54v6M8 34h6M50 34h6M15 17l4 4M45 17l-4 4' stroke='%2322C55E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
    <div id="root"></div>
    <!--
      Rede de segurança do app instalado: num tablet não existe console para
      abrir. Se o pacote não chegar a rodar, o erro aparece na tela em vez de
      deixar o auditor diante de um retângulo preto. ES5 de propósito —
      precisa funcionar exatamente onde o resto falhou.
    -->
    <script>
      (function () {
        var mostrado = false;
        function mostrar(titulo, detalhe) {
          if (mostrado) return; mostrado = true;
          var r = document.getElementById('root'); if (!r) return;
          r.innerHTML = '';
          var c = document.createElement('div');
          c.style.cssText = 'font:15px system-ui,sans-serif;color:#fff;padding:26px;max-width:640px;margin:60px auto;border:1px solid #23252e;border-radius:14px;background:#18191f';
          var h = document.createElement('div');
          h.style.cssText = 'font-weight:800;font-size:17px;margin-bottom:10px'; h.textContent = titulo;
          var p = document.createElement('pre');
          p.style.cssText = 'white-space:pre-wrap;word-break:break-word;color:#f87171;font-size:12.5px;margin:0'; p.textContent = detalhe || '(sem detalhe)';
          c.appendChild(h); c.appendChild(p); r.appendChild(c);
        }
        window.addEventListener('error', function (e) {
          var a = e && e.target;
          if (a && (a.src || a.href)) mostrar('Arquivo do app não carregou', String(a.src || a.href));
          else mostrar('Falha ao iniciar o Programa 5S + SOL', e && e.message ? e.message : String(e));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason; mostrar('Erro não tratado', r && r.message ? r.message : String(r));
        });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.firstChild) mostrar('O app não terminou de carregar', 'A tela ficou vazia por 10 segundos. Sem internet, as auditorias não carregam.');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
